<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{

    margin:0;

    font-family:Arial, sans-serif;

    background:#0f172a;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.login{

    background:white;

    padding:40px;

    border-radius:12px;

    width:350px;

}

h2{

    text-align:center;

    margin-bottom:20px;

}

input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border-radius:8px;

    border:1px solid #ccc;

    box-sizing:border-box;

}

button{

    width:100%;

    padding:12px;

    border:none;

    background:#2563eb;

    color:white;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#1d4ed8;

}

#erro{

    color:red;

    margin-top:10px;

    text-align:center;

}

</style>

</head>

<body>

<div class="login">

<h2>Sistema de Login</h2>

<input
type="email"
id="email"
placeholder="Digite seu email"
>

<input
type="password"
id="senha"
placeholder="Digite sua senha"
>

<button id="btnLogin">

Entrar

</button>

<div id="erro"></div>

</div>

<script type="module">

import {

  auth,

  signInWithEmailAndPassword

} from './firebase.js';

const btnLogin =
document.getElementById('btnLogin');

btnLogin.addEventListener('click', async () => {

    const email =
    document.getElementById('email').value;

    const senha =
    document.getElementById('senha').value;

    const erro =
    document.getElementById('erro');

    erro.innerText = "";

    try{

        await signInWithEmailAndPassword(

            auth,

            email,

            senha

        );

        window.location.href =
        "index.html";

    }

    catch(error){

        erro.innerText =
        "Email ou senha inválidos";

        console.log(error);

    }

});

</script>

</body>
</html>
