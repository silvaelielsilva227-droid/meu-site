<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão Orçamentária</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login { background: white; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; outline: none; font-size: 15px;}
        input:focus { border-color: #2563eb; }
        button { width: 100%; padding: 12px; border: none; background: #2563eb; color: white; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s;}
        button:hover { background: #1d4ed8; }
        #btnEsqueciSenha { background: transparent; color: #64748b; margin-top: 15px; font-size: 14px; text-decoration: underline; font-weight: normal; }
        #btnEsqueciSenha:hover { color: #0f172a; }
        #erro { color: #ef4444; margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login">
        <h2>Acesso Restrito</h2>
        <input type="email" id="email" placeholder="Digite seu email institucional">
        <input type="password" id="senha" placeholder="Digite sua senha">
        
        <button id="btnLogin">Entrar no Sistema</button>
        <button id="btnEsqueciSenha">Esqueci minha senha</button>
        
        <div id="erro"></div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, sendPasswordResetEmail } from './firebase.js';

        const btnLogin = document.getElementById('btnLogin');
        const btnEsqueciSenha = document.getElementById('btnEsqueciSenha');
        const erro = document.getElementById('erro');

        // FUNÇÃO 1: ENTRAR NO SISTEMA
        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            erro.innerText = "";

            if (!email || !senha) {
                erro.innerText = "Preencha e-mail e senha.";
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                window.location.href = "index.html";
            } catch (error) {
                erro.innerText = "Acesso negado. Verifique suas credenciais.";
                console.error(error);
            }
        });

        // FUNÇÃO 2: ESQUECI MINHA SENHA
        btnEsqueciSenha.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            erro.innerText = "";

            if (!email) {
                erro.innerText = "Digite seu e-mail acima para recuperar a senha.";
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                alert("Se o e-mail existir no sistema, um link de redefinição foi enviado!");
            } catch (error) {
                erro.innerText = "Erro ao solicitar recuperação de senha.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
